<style>

<body>
<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Hauptnavigation"></nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ===== LOGIC (rein, ohne DOM) ===== */
const NIGHT_FROM = 21*60+30, NIGHT_TO = 6*60;
const FEEL_FACTOR = [0.80, 0.90, 1.00, 1.05, 1.10];
const FEEL_MAXRIDE = [1.5, 2.5, 4, 5.5, 7];

function haversine(lat1, lon1, lat2, lon2){
  const R=6371, r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}

/* Route: pts = [[km, ele, lat, lon], ...] */
function buildRoute(raw, name){
  if(raw.length<2) throw new Error('Zu wenige Punkte in der GPX-Datei.');
  const kept=[]; let km=0, lastKept=null, prev=raw[0];
  for(let i=0;i<raw.length;i++){
    const p=raw[i];
    if(i>0) km+=haversine(prev[0],prev[1],p[0],p[1]);
    prev=p;
    if(lastKept===null || km-lastKept>=0.1 || i===raw.length-1){ kept.push([km, p[2], p[0], p[1]]); lastKept=km; }
  }
  // Höhe glätten (gleitender Mittelwert über 5 Punkte), um GPS-Rauschen nicht als Höhenmeter zu zählen
  const hasEle = raw.some(p=>p[2]!=null && !isNaN(p[2]));
  const sm = kept.map((p,i)=>{
    if(!hasEle) return 0;
    let s=0,n=0; for(let j=Math.max(0,i-2);j<=Math.min(kept.length-1,i+2);j++){ if(kept[j][1]!=null&&!isNaN(kept[j][1])){s+=kept[j][1];n++;} }
    return n? s/n : 0;
  });
  const pts = kept.map((p,i)=>[Math.round(p[0]*1000)/1000, Math.round(sm[i]*10)/10, Math.round(p[2]*1e5)/1e5, Math.round(p[3]*1e5)/1e5]);
  const r = {name:name||'Route', pts, hasEle};
  r.totalKm = pts[pts.length-1][0];
  r.totalHm = Math.round(cumUp(r)[pts.length-1]);
  return r;
}
function parseGPX(text, name){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  let nodes = Array.from(doc.getElementsByTagName('trkpt'));
  if(!nodes.length) nodes = Array.from(doc.getElementsByTagName('rtept'));
  if(!nodes.length) throw new Error('Keine Track- oder Routenpunkte gefunden.');
  const raw = nodes.map(n=>{
    const e = n.getElementsByTagName('ele')[0];
    return [parseFloat(n.getAttribute('lat')), parseFloat(n.getAttribute('lon')), e? parseFloat(e.textContent) : null];
  }).filter(p=>!isNaN(p[0])&&!isNaN(p[1]));
  return buildRoute(raw, name);
}
const _cum = new WeakMap();
function cumUp(route){
  if(_cum.has(route)) return _cum.get(route);
  const p=route.pts, c=new Array(p.length); c[0]=0;
  for(let i=1;i<p.length;i++) c[i]=c[i-1]+Math.max(0,p[i][1]-p[i-1][1]);
  _cum.set(route,c); return c;
}
function idxAt(pts, km){ // grösster Index mit pts[i][0] <= km
  let lo=0, hi=pts.length-1;
  if(km<=pts[0][0]) return 0;
  if(km>=pts[hi][0]) return hi;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(pts[mid][0]<=km) lo=mid; else hi=mid-1; }
  return lo;
}
function eleAt(route, km){
  if(!route) return 0;
  const p=route.pts, i=idxAt(p,km);
  if(i>=p.length-1) return p[p.length-1][1];
  const a=p[i], b=p[i+1], f=(km-a[0])/((b[0]-a[0])||1);
  return a[1]+(b[1]-a[1])*Math.max(0,Math.min(1,f));
}
function hmBetween(route, a, b){
  if(!route || b<=a) return 0;
  const p=route.pts, c=cumUp(route);
  const ia=idxAt(p,a), ib=idxAt(p,b);
  if(ia===ib) return Math.max(0, eleAt(route,b)-eleAt(route,a));
  let hm = c[ib]-c[ia+1];
  hm += Math.max(0, p[ia+1][1]-eleAt(route,a));
  hm += Math.max(0, eleAt(route,b)-p[ib][1]);
  return Math.max(0,hm);
}
function snapToRoute(route, lat, lon){
  let best=null;
  for(const p of route.pts){
    const d=haversine(lat,lon,p[2],p[3]);
    if(!best||d<best.dist) best={km:p[0], dist:d};
  }
  return best;
}
function isNight(ms){
  const d=new Date(ms), m=d.getHours()*60+d.getMinutes();
  return m>=NIGHT_FROM || m<NIGHT_TO;
}
/* Fahrt simulieren: von fromKm ab startMs; Stopp bei toKm oder untilMs */
/* Leistungsmodell (kalibriert an intervals.icu-Fahrten, siehe claude/schlafplatz-tempomodell.md) */
const MODEL_DEFAULTS = {power:170, mass:90, pause:10, cda:0.38, crr:0.005, climbK:4, climbMax:50, descDay:48, descNight:38}; // kalibriert an 19 Fahrten (Nov 2026)
function modelOf(ev){ const m=Object.assign({}, MODEL_DEFAULTS, ev.model||{}); return m; }
// Geschwindigkeit in km/h aus Leistung (W) und Steigung (Anteil), Höhe für Luftdichte
function speedKmh(P, grade, ele, m){
  const g=9.81, eta=0.97, rho=1.20*Math.exp(-(ele||0)/8500), th=Math.atan(grade);
  const a=m.mass*g*(m.crr*Math.cos(th)+Math.sin(th)), b=0.5*rho*m.cda;
  const need=v=>(a*v+b*v*v*v)/eta;
  let lo=0.5, hi=30;
  if(need(lo)>P) return lo*3.6;
  for(let k=0;k<32;k++){ const mid=(lo+hi)/2; if(need(mid)>P) hi=mid; else lo=mid; }
  return lo*3.6;
}
/* Leistungsabfall über die Stunden seit dem Aufstehen (Vollgummi vol. 2 + 3): flach stärker als am Berg */
const DECAY_FLAT  = [[0,1.0],[2,1.0],[6,0.86],[10,0.75],[14,0.70],[18,0.65],[22,0.58],[30,0.52]];
const DECAY_CLIMB = [[0,1.0],[2,1.0],[6,0.89],[10,0.82],[14,0.79],[18,0.76],[22,0.75],[30,0.72]];
function interpPts(pts,h){
  if(h<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++){ const [a,x]=pts[i-1], [b,y]=pts[i]; if(h<=b) return x+(y-x)*(h-a)/(b-a); }
  return pts[pts.length-1][1];
}
function decayAt(h, pct){ const w=Math.min(1,Math.max(0,pct/4)); return interpPts(DECAY_FLAT,h)*(1-w)+interpPts(DECAY_CLIMB,h)*w; }
function segSpeed(grade, ele, ms, feelF, m, wakeMs){
  const pct=grade*100;
  const mult = pct>=0 ? Math.min(1+m.climbK/100*pct, 1+m.climbMax/100) : Math.max(0, 1+m.climbK/100*pct);
  const f = wakeMs!=null ? decayAt(Math.max(0,(ms-wakeMs)/3600e3), pct) : 1;
  let v = speedKmh(Math.max(5, m.power*feelF*mult*f), grade, ele, m);
  const cap = isNight(ms) ? m.descNight : m.descDay;
  if(v>cap) v=cap;
  return Math.max(3, v);
}
/* Fahrt simulieren: von fromKm ab startMs; Stopp bei toKm oder untilMs. Zeiten inkl. Pausenanteil. */
function walk(ev, fromKm, startMs, feelF, toKm, untilMs, wakeMs){
  const route=ev.route, m=modelOf(ev), pf=1+(m.pause||0)/100;
  const pts = route && route.pts;
  const endKm = toKm!=null ? toKm : (pts ? pts[pts.length-1][0] : fromKm+3000);
  let km=fromKm, t=startMs, ele=eleAt(route,km), hm=0;
  let i = pts ? idxAt(pts,km)+1 : 0;
  let guard=0;
  while(km < endKm-1e-9 && guard++<200000){
    let nk;
    if(pts){ nk = i<pts.length ? Math.min(pts[i][0], endKm) : endKm; i++; }
    else nk = Math.min(endKm, Math.floor(km+1e-9)+1);
    if(nk<=km) continue;
    const ne=eleAt(route,nk), dk=nk-km, dh=ne-ele;
    const v = segSpeed(dh/(dk*1000), (ele+ne)/2, t, feelF, m, wakeMs);
    const dt = dk/v*3600e3*pf;
    if(untilMs!=null && t+dt>untilMs){
      const f=(untilMs-t)/dt;
      return {km:km+dk*f, t:untilMs, hm:hm+Math.max(0,dh)*f};
    }
    t+=dt; km=nk; ele=ne; hm+=Math.max(0,dh);
  }
  return {km, t, hm, end:true};
}
/* Umweg ab Route: hin = bergauf um detHm, zurück = bergab */
function detourMs(ev, detKm, detHm, feelF, atMs, back, wakeMs){
  if(!detKm) return 0;
  const m=modelOf(ev), gr=(detHm||0)/(detKm*1000)*(back?-1:1);
  return detKm/segSpeed(gr, 0, atMs, feelF, m, wakeMs)*3600e3*(1+(m.pause||0)/100);
}
function parseHHMM(s){
  if(!s) return null;
  const m=String(s).trim().match(/^(\d{1,2})[:.h](\d{2})/);
  if(!m) return null;
  const h=+m[1], mi=+m[2];
  if(h>24||mi>59) return null;
  return h*60+mi;
}
function deadlineMs(etaMs, hhmm){
  const mins=parseHHMM(hhmm); if(mins==null) return null;
  const d=new Date(etaMs); const eh=d.getHours();
  const dl=new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(mins/60), mins%60).getTime();
  const dh=Math.floor(mins/60);
  if(dh<6 && eh>=12) return dl+86400e3;
  if(eh<6 && dh>=12) return dl-86400e3;
  return dl;
}
function refMs(nowMs, hhmm){
  const mins=parseHHMM(hhmm)??(9*60);
  const d=new Date(nowMs);
  let r=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(mins/60),mins%60).getTime();
  while(r < nowMs+6*3600e3) r+=86400e3;
  return r;
}
function lateOk(v){ v=(v||'').toLowerCase(); return v==='ja'||v.startsWith('schl'); }
function lateAsk(v){ return (v||'').toLowerCase().startsWith('auf'); }

/* Aufstehzeit für den laufenden Renntag (Renntag wechselt um 04:00) */
function dayKey(ms){ const d=new Date(ms-4*3600e3); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function raceStartMs(ev){
  if(!ev.startDate) return null; const [y,mo,d]=ev.startDate.split('-').map(Number);
  const [h,mi]=(ev.startTime||'06:00').split(':').map(Number); return new Date(y,mo-1,d,h||0,mi||0).getTime();
}
function wakeFor(ev, nowMs){
  const L=ev.lage||{};
  if(L.wake && L.wakeFor===dayKey(nowMs) && L.wake<=nowMs) return L.wake;
  const rs=raceStartMs(ev);
  if(rs!=null && rs<=nowMs && nowMs-rs<20*3600e3) return rs;
  if(ev.lastStartMs && ev.lastStartMs<=nowMs && nowMs-ev.lastStartMs<22*3600e3) return ev.lastStartMs;
  const d=new Date(nowMs-4*3600e3); return new Date(d.getFullYear(),d.getMonth(),d.getDate(),5,0).getTime();
}
function computeOptions(ev, nowMs){
  const L=ev.lage;
  const curKm=+L.km||0;
  const feelF=FEEL_FACTOR[(L.feel||3)-1];
  const mdl=modelOf(ev);
  const limitMs = nowMs + (L.maxRide||4)*3600e3;
  const wakeMs = wakeFor(ev, nowMs);
  const reach = walk(ev,curKm,nowMs,feelF,null,limitMs,wakeMs);
  const ref = refMs(nowMs, ev.refTime);
  const res=[]; let behind=0, noKm=0;
  for(const a of ev.accs){
    if(a.km==null||isNaN(a.km)){ noKm++; continue; }
    if(a.km < curKm-0.2){ behind++; continue; }
    const w = walk(ev,curKm,nowMs,feelF,a.km,null,wakeMs);
    const det = detourMs(ev,a.detKm,a.detHm,feelF,w.t,false,wakeMs);
    const eta = w.t + det;
    const hm = Math.round(w.hm + (a.detHm||0));
    const dl = lateOk(a.late) ? null : deadlineMs(eta, a.checkin);
    const reserve = dl==null ? null : Math.round((dl-eta)/60e3);
    const start = eta + (L.minSleep||270)*60e3;
    let posRef = a.km;
    const back = detourMs(ev,a.detKm,a.detHm,1,start,true,start);
    if(start+back < ref) posRef = walk(ev,a.km,start+back,1,null,ref,start).km;
    const status = (ev.status&&ev.status[a.id]) || a.status || 'offen';
    let cls;
    if(status==='abgesagt') cls='abgesagt';
    else if(reserve!=null && reserve<0 && !lateAsk(a.late)) cls='unreachable';
    else if(eta > limitMs + 15*60e3) cls='overlimit';
    else if(reserve!=null && reserve<0) cls='ask';
    else if(reserve!=null && reserve<30) cls='tight';
    else cls='ok';
    const feasible = cls==='ok'||cls==='tight'||cls==='ask';
    const score = posRef + (a.prio==='A'?3:0) - (cls==='tight'?5:0) - (cls==='ask'?8:0);
    res.push({a, dist:a.km-curKm+(a.detKm||0), hm, eta, reserve, dl, start, posRef, status, cls, feasible, score});
  }
  const order={ok:0,tight:0,ask:0,overlimit:1,unreachable:2,abgesagt:3};
  res.sort((x,y)=> order[x.cls]-order[y.cls] || (x.feasible? y.score-x.score : x.eta-y.eta));
  const best = res.find(r=>r.feasible && r.cls==='ok') || res.find(r=>r.feasible);
  if(best){ best.recommended=true; res.splice(res.indexOf(best),1); res.unshift(best); }
  return {list:res, mdl, feelF, wakeMs, powerNow:mdl.power*feelF*decayAt(Math.max(0,(nowMs-wakeMs)/3600e3),0), reachKm:reach.km, limitMs, ref, behind, noKm, curKm};
}

/* CSV */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const cnt=c=>first.split(c).length-1;
  const sep = cnt('\t')>cnt(';')&&cnt('\t')>cnt(',') ? '\t' : (cnt(';')>cnt(',') ? ';' : ',');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    } else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function normH(s){ return String(s).toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/[^a-z]/g,''); }
const COLS = {prio:'prio',name:'name',ort:'ort',routenkm:'km',umwegkm:'detKm',umweghm:'detHm',checkinbis:'checkin',latecheckin:'late',velo:'velo',status:'status',sprache:'lang',telefon:'phone',whatsapp:'wa',mail:'mail',email:'mail',fruhstuck:'breakfast',preisca:'price',preis:'price',koordinatenlink:'coords',koordinaten:'coords',notizen:'notes'};
function num(s){
  if(s==null) return null; s=String(s).trim().replace(/['’\s]/g,'');
  if(s==='') return null;
  if(s.includes(',')&&!s.includes('.')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function parseCoords(s){
  const m=String(s||'').match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  return m? {lat:+m[1], lon:+m[2]} : null;
}
function rowsToAccs(rows, route){
  if(rows.length<2) throw new Error('Keine Datenzeilen gefunden.');
  const head=rows[0].map(h=>COLS[normH(h)]||null);
  if(!head.includes('name')) throw new Error('Spalte «Name» fehlt in der Kopfzeile.');
  const out=[];
  rows.slice(1).forEach((r,ix)=>{
    const o={};
    head.forEach((k,i)=>{ if(k) o[k]=(r[i]||'').trim(); });
    if(!o.name) return;
    const a={
      id:'a'+Date.now().toString(36)+ix, prio:(o.prio||'').toUpperCase().startsWith('A')?'A':((o.prio||'').toUpperCase().startsWith('B')?'B':''),
      name:o.name, ort:o.ort||'', km:num(o.km), detKm:num(o.detKm), detHm:num(o.detHm),
      checkin:o.checkin||'', late:o.late||'', velo:o.velo||'', status:(o.status||'offen').toLowerCase(),
      lang:(o.lang||'').toUpperCase().slice(0,2), phone:o.phone||'', wa:o.wa||'', mail:o.mail||'',
      breakfast:o.breakfast||'', price:o.price||'', coords:o.coords||'', notes:o.notes||'', kmGuessed:false
    };
    const c=parseCoords(a.coords);
    if(c && route && a.km==null){
      const s=snapToRoute(route,c.lat,c.lon);
      a.km=Math.round(s.km*10)/10; a.kmGuessed=true;
      if(a.detKm==null) a.detKm=Math.round(s.dist*1.3*10)/10;
    }
    out.push(a);
  });
  return out;
}

function wakeCard(e, now){
  const L=e.lage, w=wakeFor(e, now), h=Math.max(0,(now-w)/3600e3), m=modelOf(e), fF=FEEL_FACTOR[(L.feel||3)-1];
  const pNow=Math.round(m.power*fF*decayAt(h,0)), drop=Math.round((1-decayAt(h,0))*100);
  const manual = L.wake && L.wakeFor===dayKey(now);
  return `<div class="card">
    <div class="between"><div class="stat"><span class="l" style="font-size:13px">Heute unterwegs seit</span><span class="v" style="font-size:22px">${hmPlain(w)} <span class="small muted" style="font-weight:500">· ${dur(h*60)}</span></span></div>
      <div class="row"><button class="sq" aria-label="30 Minuten früher" data-a="wake" data-d="-1">−</button><button class="sq" aria-label="30 Minuten später" data-a="wake" data-d="1">+</button></div></div>
    <span class="small soft">Rechnet jetzt mit ${pNow} W flach${drop>0?` (−${drop} % seit dem Aufstehen)`:''}, am Berg mehr; ${m.pause} % Pausen.</span>
    ${manual?`<button class="btn sm" style="background:transparent;border:none;color:var(--muted);min-height:36px;justify-content:flex-start;padding:0;text-decoration:underline;text-underline-offset:3px" data-a="wakeAuto">Automatisch bestimmen</button>`:`<span class="tiny muted">Automatisch: ${raceStartMs(e)!=null && w===raceStartMs(e)?'Rennstart':(e.lastStartMs===w?'Start nach der letzten gebuchten Unterkunft':'Annahme 05:00')} – bei Bedarf anpassen.</span>`}
  </div>`;
}
function modelCard(e){
  const m=modelOf(e);
  const row=(label,k,shown,hint)=>`<div class="list-row"><div class="stack" style="gap:2px;min-width:0"><span style="font-size:15px">${label}</span>${hint?`<span class="tiny muted">${hint}</span>`:''}</div><div class="row"><button class="sq" style="width:40px;height:40px" aria-label="${label} verringern" data-a="mStep" data-k="${k}" data-d="-1">−</button><span style="min-width:62px;text-align:center;font-weight:600">${shown}</span><button class="sq" style="width:40px;height:40px" aria-label="${label} erhöhen" data-a="mStep" data-k="${k}" data-d="1">+</button></div></div>`;
  return `<div class="card" style="gap:4px">
    <h2>Tempomodell</h2>
    <span class="small muted">Das Tempo wird aus Leistung, Steigung, Gewicht und Luftwiderstand berechnet – kalibriert an 19 deiner Fahrten (±3 %).</span>
    <div style="padding-top:4px">
    ${row('Leistung flach, ausgeruht','power',m.power+' W','erste Stunden nach dem Aufstehen')}
    ${row('Systemgewicht','mass',m.mass+' kg','Fahrer, Rad, Gepäck, Wasser')}
    ${row('Pausen','pause',m.pause+' %','Anteil zur Fahrzeit')}
    </div>
    <details data-keep="fine" ${ui.open&&ui.open.fine?'open':''}><summary>Feineinstellungen</summary><div>
    ${row('Mehrleistung am Berg','climbK','+'+m.climbK+' %','pro % Steigung')}
    ${row('Mehrleistung höchstens','climbMax','+'+m.climbMax+' %','')}
    ${row('Abfahrt max. Tag','descDay',m.descDay+' km/h','')}
    ${row('Abfahrt max. Nacht','descNight',m.descNight+' km/h','21:30–6:00')}
    ${row('Luftwiderstand CdA','cda',m.cda.toFixed(2)+' m²','mit Taschen eher höher')}
    ${row('Rollwiderstand Crr','crr',m.crr.toFixed(4),'')}
    <button class="btn sm" data-a="mReset" style="margin-top:8px">Standardwerte</button>
    </div></details>
    <span class="small muted">Sinkt automatisch mit den Stunden seit dem Aufstehen, wie bei deinen Vollgummi-Fahrten: nach 8 h flach etwa −20 %, nach 16 h etwa −33 %, am Berg weniger.</span>
    <span class="small soft">Ausgeruht: flach ${fmtKm(speedKmh(m.power,0,300,m))} km/h · 6 % Steigung ${fmtKm(speedKmh(Math.min(m.power*(1+m.climbK*6/100), m.power*(1+m.climbMax/100)),0.06,800,m))} km/h</span>
  </div>`;
}
function numRow(label, key, shown, k){
  return `<div class="list-row"><span style="font-size:15px">${label}</span><div class="row"><button class="sq" style="width:40px;height:40px" aria-label="${label} verringern" data-a="setStep" data-k="${k}" data-d="-1">−</button><span style="min-width:62px;text-align:center;font-weight:600">${shown}</span><button class="sq" style="width:40px;height:40px" aria-label="${label} erhöhen" data-a="setStep" data-k="${k}" data-d="1">+</button></div></div>`;
}

/* ---- Optionen ---- */
let lastCalc=null;
function viewOptionen(){
  const e=ev(), L=e.lage, now=fromLocalInput(L.time);
  const c=computeOptions(e, now); lastCalc=c;
  const feas=c.list.filter(r=>r.feasible).length;
  const cards=c.list.map(r=>optCard(r, now, c)).join('');
  return `<div class="stack">
    <div class="row"><button class="back" aria-label="Zurück zur Lage" data-a="go" data-v="lage" style="color:var(--text)">${ICON.back}</button>
      <div class="stack" style="gap:2px"><h1 style="font-size:24px">${feas} ${feas===1?'Option':'Optionen'}</h1><span class="small muted">ab km ${fmtKm(c.curKm)} · ${hmPlain(now)} · Gefühl ${L.feel} · ${dur(L.minSleep)} Schlaf</span></div></div>
    <div class="note">Realistisch heute noch bis ca. <strong style="color:var(--text)">km ${fmtKm(c.reachKm)}</strong> (${dur(L.maxRide*60)} unterwegs, jetzt ${Math.round(c.powerNow)} W flach und sinkend, Steigungen, Pausen und Nacht eingerechnet). «Morgen» = Position um ${hmPlain(c.ref)}.</div>
    ${cards || `<div class="note">Keine Unterkünfte vor dir.${!e.accs.length?' Im Setup welche importieren.':''}</div>`}
    ${c.behind||c.noKm?`<span class="small muted">${c.behind?c.behind+' bereits hinter dir':''}${c.behind&&c.noKm?' · ':''}${c.noKm?c.noKm+' ohne Routen-km':''}</span>`:''}
  </div>`;
}
function badge(r){
  if(r.status==='gebucht') return '<span class="pill p-good">Gebucht</span>';
  if(r.recommended) return '<span class="pill p-accent">Empfohlen</span>';
  return {ok:'<span class="pill">Möglich</span>', tight:'<span class="pill p-warn">Knapp</span>', ask:'<span class="pill p-warn">Nur nach Absprache</span>', overlimit:'<span class="pill">Über deinem Limit</span>', unreachable:'<span class="pill p-bad">Nicht erreichbar</span>', abgesagt:'<span class="pill p-bad">Abgesagt</span>'}[r.cls];
}
function optCard(r, now, c){
  const a=r.a;
  const right = [a.prio, lateOk(a.late)? (a.late.toLowerCase().startsWith('schl')?'Schlüsselbox':'Late Check-in') : (a.checkin? 'Check-in bis '+esc(a.checkin) : 'Check-in ?')].filter(Boolean).join(' · ');
  if(r.cls==='unreachable'||r.cls==='abgesagt'){
    return `<button class="opt card dim" data-a="detail" data-id="${esc(a.id)}"><div class="between"><div class="stack" style="gap:2px"><span style="font-size:15px;font-weight:600" class="muted">${esc(a.name)}</span><span class="tiny muted">+${fmtKm(r.dist)} km · Ankunft ${hm(r.eta,now)} · ${right}</span></div>${badge(r)}</div></button>`;
  }
  const resTxt = r.reserve==null ? '<span class="good">keine Frist</span>' : r.reserve<0 ? `<span class="bad">${dur(r.reserve)}</span>` : `<span class="${r.reserve<30?'warn':'good'}">${dur(r.reserve)}</span>`;
  const gain = r.posRef - c.curKm;
  return `<button class="opt card ${r.recommended?'hl':''}" data-a="detail" data-id="${esc(a.id)}">
    <div class="between">${badge(r)}<span class="small muted">${right}</span></div>
    <div class="stack" style="gap:2px"><span style="font-size:18px;font-weight:600">${esc(a.name)}</span><span class="small muted">${a.ort?esc(a.ort)+' · ':''}+${fmtKm(r.dist)} km · ${fmtInt(r.hm)} Hm${a.detKm?' · Umweg '+fmtKm(a.detKm)+' km':''}</span></div>
    <div class="grid3">
      <div class="stat"><span class="l">Ankunft</span><span class="v">${hm(r.eta,now)}</span></div>
      <div class="stat"><span class="l">Reserve</span><span class="v">${resTxt}</span></div>
      <div class="stat"><span class="l">Start morgen</span><span class="v">${hm(r.start,now)}</span></div>
    </div>
    <span class="small soft">Um ${hmPlain(c.ref)} bei km ${fmtKm(r.posRef)}${r.cls==='overlimit'?' · '+dur((r.eta-c.limitMs)/60e3)+' über deinem Limit':''}</span>
  </button>`;
}

/* ---- Gebucht ---- */
function viewGebucht(){
  const e=ev();
  if(!e.bookedId) return `<div class="stack"><div class="stack" style="gap:4px"><div class="eyebrow">Gebucht</div><h1>Noch nichts gebucht</h1></div><div class="note">Wähle in den Optionen eine Unterkunft und markiere sie als gebucht. Hier siehst du dann, wie viel noch fehlt und ob die Zeit reicht.</div><button class="btn primary" data-a="go" data-v="optionen">Zu den Optionen</button></div>`;
  const {r, now}=findCalc(e.bookedId);
  const a=e.accs.find(x=>x.id===e.bookedId);
  if(!a) return `<div class="note">Die gebuchte Unterkunft ist nicht mehr in der Liste.</div>`;
  if(!r) return `<div class="stack"><div class="stack" style="gap:6px"><span class="pill p-good" style="align-self:flex-start">Gebucht</span><h1>${esc(a.name)}</h1></div><div class="note">Du bist schon bei oder hinter dieser Unterkunft (km ${fmtKm(a.km)}). Gute Nacht!</div><button class="btn" data-a="status2" data-id="${esc(a.id)}" data-s="offen">Buchung lösen</button></div>`;
  const L=e.lage, cur=+L.km||0;
  let bars='';
  if(e.route && a.km>cur){
    const n=30, vals=[]; for(let i=0;i<=n;i++) vals.push(eleAt(e.route, cur+(a.km-cur)*i/n));
    const mn=Math.min(...vals), mx=Math.max(...vals), span=Math.max(50,mx-mn);
    bars=`<div class="card" style="gap:10px"><span class="eyebrow">Höhenprofil bis dort · ${fmtInt(mn)}–${fmtInt(mx)} m</span>
      <div class="profile" role="img" aria-label="Höhenprofil von km ${fmtKm(cur)} bis km ${fmtKm(a.km)}, ${fmtInt(r.hm)} Höhenmeter">${vals.map((v,i)=>`<div style="height:${Math.round(12+88*(v-mn)/span)}%;${i===n?'background:var(--good)':''}"></div>`).join('')}</div>
      <div class="between tiny muted"><span>km ${fmtKm(cur)}</span><span>km ${fmtKm(a.km)}</span></div></div>`;
  }
  const dlTxt = r.reserve==null ? `<div class="between card" style="background:var(--good-bg);flex-direction:row"><span style="color:#C9F0D6">Check-in-Frist</span><span style="font-size:22px;font-weight:700" class="good">keine</span></div>`
    : `<div class="between card" style="background:${r.reserve<0?'var(--bad-bg)':r.reserve<30?'#3A2E14':'var(--good-bg)'};flex-direction:row"><span>Reserve bis Check-in ${esc(a.checkin)}</span><span style="font-size:24px;font-weight:700" class="${r.reserve<0?'bad':r.reserve<30?'warn':'good'}">${r.reserve<0?'':'+'}${dur(r.reserve)}</span></div>`;
  return `<div class="stack">
    <div class="stack" style="gap:6px"><span class="pill p-good" style="align-self:flex-start">Gebucht</span><h1>${esc(a.name)}</h1><span class="small muted">${a.ort?esc(a.ort)+' · ':''}Stand ${hmPlain(now)} bei km ${fmtKm(cur)}</span></div>
    <div class="card" style="gap:4px"><span class="small muted">Noch bis zur Unterkunft</span><div class="row" style="align-items:baseline"><span class="huge">${fmtKm(r.dist)} km</span><span style="font-size:18px" class="soft">${fmtInt(r.hm)} Hm</span></div></div>
    <div class="grid2">
      <div class="tile stat"><span class="l">Ankunft</span><span class="v" style="font-size:22px">${hm(r.eta,now)}</span></div>
      <div class="tile stat"><span class="l">Start morgen</span><span class="v" style="font-size:22px">${hm(r.start,now)}</span></div>
    </div>
    ${dlTxt}
    ${bars}
    <div class="grid2"><button class="btn primary" style="font-size:16px" data-a="go" data-v="lage">Lage aktualisieren</button><button class="btn" data-a="detail" data-id="${esc(a.id)}">Kontakt / Plan</button></div>
  </div>`;
}

/* ---- Karte & Liste ---- */
const MCOL={rec:'#FFB547', ok:'#5BD68A', tight:'#F4E27A', ask:'#F4E27A', overlimit:'#9AA5AF', unreachable:'#FF9A8E', abgesagt:'#FF9A8E', behind:'#4A5560', booked:'#5BD68A', pos:'#5AA9FF'};
function markColor(r, behind){ if(behind) return MCOL.behind; if(r.status==='gebucht') return MCOL.booked; if(r.recommended) return MCOL.rec; return MCOL[r.cls]||MCOL.ok; }
function viewKarte(){
  const e=ev(), L=e.lage, now=fromLocalInput(L.time);
  const c=computeOptions(e, now); lastCalc=c;
  const head=`<div class="stack" style="gap:2px"><h1 style="font-size:24px">Unterkünfte</h1><span class="small muted">Position km ${fmtKm(c.curKm)} · ${hmPlain(now)} · ${e.accs.length} erfasst</span></div>`;
  const seg=`<div class="seg" role="group" aria-label="Ansicht wählen"><button data-a="kmode" data-m="map" aria-pressed="${ui.kmode==='map'}">Karte</button><button data-a="kmode" data-m="list" aria-pressed="${ui.kmode==='list'}">Liste</button></div>`;
  if(ui.kmode==='list') return `<div class="stack">${head}${seg}${listAll(e,c,now)}</div>`;
  if(!e.route) return `<div class="stack">${head}${seg}<div class="note">Für die Karte braucht es die Route. Im Setup die GPX-Datei laden.</div></div>`;
  let sheet='';
  if(ui.mapSel){
    const r=c.list.find(x=>x.a.id===ui.mapSel), a=e.accs.find(x=>x.id===ui.mapSel);
    if(r) sheet=`<div class="msheet"><div class="between">${badge(r)}<button class="btn sm" style="min-height:36px;width:44px;padding:0" aria-label="Schliessen" data-a="mclose">✕</button></div>
      <div class="stack" style="gap:2px"><span style="font-size:17px;font-weight:600">${esc(r.a.name)}</span><span class="small muted">${r.a.ort?esc(r.a.ort)+' · ':''}km ${fmtKm(r.a.km)} · +${fmtKm(r.dist)} km · ${fmtInt(r.hm)} Hm</span></div>
      <div class="grid3"><div class="stat"><span class="l">Ankunft</span><span class="v">${hm(r.eta,now)}</span></div><div class="stat"><span class="l">Reserve</span><span class="v">${r.reserve==null?'<span class="good">keine Frist</span>':`<span class="${r.reserve<0?'bad':r.reserve<30?'warn':'good'}">${dur(r.reserve)}</span>`}</span></div><div class="stat"><span class="l">Start morgen</span><span class="v">${hm(r.start,now)}</span></div></div>
      <button class="btn" style="border-color:var(--accent);color:var(--accent)" data-a="detail" data-id="${esc(r.a.id)}">Details & Kontakt</button></div>`;
    else if(a) sheet=`<div class="msheet"><div class="between"><span class="pill">Hinter dir</span><button class="btn sm" style="min-height:36px;width:44px;padding:0" aria-label="Schliessen" data-a="mclose">✕</button></div><div class="stack" style="gap:2px"><span style="font-size:17px;font-weight:600">${esc(a.name)}</span><span class="small muted">${a.ort?esc(a.ort)+' · ':''}km ${a.km!=null?fmtKm(a.km):'?'} · Status: ${esc((e.status&&e.status[a.id])||a.status||'offen')}</span></div></div>`;
  }
  const lg=[['rec','Empfohlen'],['ok','Möglich'],['tight','Knapp'],['overlimit','Über Limit'],['unreachable','Nicht erreichbar'],['behind','Hinter dir']].map(([k,l])=>`<span><i class="dot" style="background:${MCOL[k]}"></i>${l}</span>`).join('');
  return `<div class="stack">${head}${seg}
    <div class="mapwrap"><canvas id="map" role="img" aria-label="Karte: Route, deine Position bei km ${fmtKm(c.curKm)} und ${e.accs.length} Unterkünfte"></canvas>
      <div class="mapbtns"><button data-a="mzoom" data-d="1" aria-label="Hineinzoomen">+</button><button data-a="mzoom" data-d="-1" aria-label="Herauszoomen">−</button><button data-a="mpos" aria-label="Auf meine Position zentrieren">${ICON.gps}</button><button data-a="mfit" aria-label="Ganze Route zeigen">${ICON.fit}</button></div>
      ${sheet}</div>
    <div class="legend"><span><i class="dot" style="background:${MCOL.pos}"></i>Du</span><span><i class="dot" style="background:#FFB547;border-radius:2px;width:16px;height:4px"></i>heute erreichbar</span>${lg}</div>
  </div>`;
}
function listAll(e, c, now){
  const byId=new Map(c.list.map(r=>[r.a.id,r]));
  const sorted=e.accs.slice().sort((a,b)=>(a.km??1e9)-(b.km??1e9));
  const ahead=sorted.filter(a=>byId.has(a.id)), behind=sorted.filter(a=>a.km!=null && !byId.has(a.id)), nokm=sorted.filter(a=>a.km==null);
  if(!e.accs.length) return `<div class="note">Noch keine Unterkünfte erfasst. Im Setup importieren.</div>`;
  const rowA=a=>{ const r=byId.get(a.id); const res=r.reserve==null?'keine Frist':(r.reserve<0?dur(r.reserve):'+'+dur(r.reserve));
    return `<button class="opt card" style="padding:12px 14px;gap:6px;${r.cls==='unreachable'||r.cls==='abgesagt'?'opacity:.6':''}" data-a="detail" data-id="${esc(a.id)}">
      <div class="lrow"><span class="lkm">km ${fmtKm(a.km)}</span><span style="flex:1;min-width:0;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</span>${badge(r)}</div>
      <div class="lrow small muted"><span class="lkm">+${fmtKm(r.dist)}</span><span style="flex:1">${a.prio?a.prio+' · ':''}an ${hm(r.eta,now)} · Reserve ${res} · Start ${hm(r.start,now)}</span></div></button>`; };
  const rowB=a=>`<div class="lrow small" style="min-height:44px;border-bottom:1px solid var(--line)"><span class="lkm">km ${fmtKm(a.km)}</span><span style="flex:1" class="muted">${esc(a.name)}${a.ort?' · '+esc(a.ort):''}</span><span class="tiny muted">${esc((e.status&&e.status[a.id])||a.status||'offen')}</span></div>`;
  return `<div class="stack" style="gap:10px">
    <span class="eyebrow">Vor dir · ${ahead.length}</span>
    ${ahead.map(rowA).join('')||'<div class="note">Keine Unterkünfte mehr vor dir.</div>'}
    ${behind.length?`<details><summary>Hinter dir · ${behind.length}</summary><div>${behind.slice().reverse().map(rowB).join('')}</div></details>`:''}
    ${nokm.length?`<details><summary>Ohne Position · ${nokm.length}</summary><div>${nokm.map(a=>`<div class="lrow small" style="min-height:44px;border-bottom:1px solid var(--line)"><span class="muted">${esc(a.name)}${a.ort?' · '+esc(a.ort):''}</span></div>`).join('')}</div></details>`:''}
  </div>`;
}

/* Kartenmotor: zeichnet die Route aus dem GPX auf ein Canvas, ohne Kartenkacheln */
const _proj=new WeakMap();
function projRoute(route){
  if(_proj.has(route)) return _proj.get(route);
  const p=route.pts; let la=0, lo=0; for(const q of p){ la+=q[2]; lo+=q[3]; } la/=p.length; lo/=p.length;
  const k=Math.cos(la*Math.PI/180);
  const xy=p.map(q=>[(q[3]-lo)*k*111.32, -(q[2]-la)*110.57]);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; for(const [x,y] of xy){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const P={lat0:la, lon0:lo, k, xy, box:[x0,y0,x1,y1]}; _proj.set(route,P); return P;
}
function projLL(P, lat, lon){ return [(lon-P.lon0)*P.k*111.32, -(lat-P.lat0)*110.57]; }
function routeLL(route, km){
  const p=route.pts, i=idxAt(p,km);
  if(i>=p.length-1) return [p[i][2],p[i][3]];
  const a=p[i], b=p[i+1], f=Math.max(0,Math.min(1,(km-a[0])/((b[0]-a[0])||1)));
  return [a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
}
function accLL(e, a){ const c=parseCoords(a.coords); if(c) return [c.lat,c.lon]; if(a.km!=null && e.route) return routeLL(e.route, a.km); return null; }
let M=null;
function mapFit(){
  const P=M.P, [x0,y0,x1,y1]=P.box;
  ui.map.cx=(x0+x1)/2; ui.map.cy=(y0+y1)/2;
  ui.map.scale=Math.min((M.W-40)/Math.max(1,x1-x0), (M.H-40)/Math.max(1,y1-y0));
}
function mapMinScale(){ const [x0,y0,x1,y1]=M.P.box; return 0.4*Math.min(M.W/Math.max(1,x1-x0), M.H/Math.max(1,y1-y0)); }
function mapCenterPos(){
  const e=ev(); const [la,lo]=routeLL(e.route, +e.lage.km||0); const [x,y]=projLL(M.P,la,lo);
  ui.map.cx=x; ui.map.cy=y; if(ui.map.scale<Math.min(M.W,M.H)/160) ui.map.scale=Math.min(M.W,M.H)/120; drawMap();
}
function mapZoom(f, sx, sy){
  if(sx==null){ sx=M.W/2; sy=M.H/2; }
  const m=ui.map, ns=Math.max(mapMinScale(), Math.min(600, m.scale*f));
  const wx=m.cx+(sx-M.W/2)/m.scale, wy=m.cy+(sy-M.H/2)/m.scale;
  m.scale=ns; m.cx=wx-(sx-M.W/2)/ns; m.cy=wy-(sy-M.H/2)/ns; drawMap();
}
function initMap(){
  const cv=document.getElementById('map'); if(!cv) return;
  const e=ev(), wrap=cv.parentElement, dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  M={cv, P:projRoute(e.route), W, H, dpr, marks:[]};
  if(!ui.map || ui.map.key!==e.id+'|'+e.route.totalKm){
    ui.map={key:e.id+'|'+e.route.totalKm, cx:0, cy:0, scale:1};
    const [la,lo]=routeLL(e.route, +e.lage.km||0); const [x,y]=projLL(M.P,la,lo);
    ui.map.cx=x; ui.map.cy=y; ui.map.scale=Math.min(W,H)/120;
  }
  drawMap();
  const ptrs=new Map(); let moved=false, start=null, pinch=null;
  const pt=ev_=>{ const r=cv.getBoundingClientRect(); return {x:ev_.clientX-r.left, y:ev_.clientY-r.top}; };
  cv.addEventListener('pointerdown', ev_=>{
    try{ cv.setPointerCapture(ev_.pointerId); }catch(_){}
    const p=pt(ev_); ptrs.set(ev_.pointerId,p);
    if(ptrs.size===1){ moved=false; start=p; }
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, scale:ui.map.scale, cx:ui.map.cx, cy:ui.map.cy, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; moved=true; }
  });
  cv.addEventListener('pointermove', ev_=>{
    if(!ptrs.has(ev_.pointerId)) return;
    const prev=ptrs.get(ev_.pointerId), p=pt(ev_); ptrs.set(ev_.pointerId,p);
    const m=ui.map;
    if(ptrs.size===1){
      if(Math.abs(p.x-start.x)+Math.abs(p.y-start.y)>8) moved=true;
      if(moved){ m.cx-=(p.x-prev.x)/m.scale; m.cy-=(p.y-prev.y)/m.scale; drawMap(); }
    } else if(ptrs.size===2 && pinch){
      const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const ns=Math.max(mapMinScale(), Math.min(600, pinch.scale*d/pinch.d));
      const wx=pinch.cx+(pinch.mx-W/2)/pinch.scale, wy=pinch.cy+(pinch.my-H/2)/pinch.scale;
      m.scale=ns; m.cx=wx-(mx-W/2)/ns; m.cy=wy-(my-H/2)/ns; drawMap();
    }
  });
  const up=ev_=>{
    if(!ptrs.has(ev_.pointerId)) return;
    const p=pt(ev_); ptrs.delete(ev_.pointerId);
    if(ptrs.size<2) pinch=null;
    if(ptrs.size===0 && !moved && ev_.type==='pointerup') mapTap(p.x,p.y);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', ev_=>{ ev_.preventDefault(); const p=pt(ev_); mapZoom(Math.exp(-ev_.deltaY*0.0015), p.x, p.y); }, {passive:false});
}
function mapTap(x,y){
  let best=null;
  for(const mk of M.marks){ const d=Math.hypot(mk.x-x, mk.y-y); if(d<26 && (!best||d<best.d)) best={d,id:mk.id}; }
  const nid = best ? best.id : null;
  if(nid && best){ // ausgewählten Punkt ins obere Drittel schieben, damit die Karte unten ihn nicht verdeckt
    const mk=M.marks.find(q=>q.id===nid), m=ui.map;
    if(mk.y > M.H*0.45){ m.cy += (mk.y - M.H*0.3)/m.scale; }
  }
  if(nid!==ui.mapSel){ ui.mapSel=nid; render(); }
}
function drawMap(){
  if(!M || !M.cv.isConnected) return;
  const e=ev(), c=lastCalc, g=M.cv.getContext('2d'), W=M.W, H=M.H, m=ui.map, pts=e.route.pts, xy=M.P.xy;
  g.setTransform(M.dpr,0,0,M.dpr,0,0);
  g.fillStyle='#0B0E11'; g.fillRect(0,0,W,H);
  const S=(x,y)=>[(x-m.cx)*m.scale+W/2, (y-m.cy)*m.scale+H/2];
  const cur=c?c.curKm:(+e.lage.km||0), reach=c?Math.max(cur,c.reachKm):cur, total=e.route.totalKm;
  // Raster als Massstab: 10/50/100 km
  const stroke=(from,to,color,w)=>{
    if(to<=from) return;
    g.beginPath(); let st=false, lx=0, ly=0;
    const i0=idxAt(pts,from);
    for(let i=i0;i<pts.length;i++){
      const [x,y]=S(xy[i][0],xy[i][1]);
      if(!st){ g.moveTo(x,y); st=true; lx=x; ly=y; }
      else if(Math.abs(x-lx)+Math.abs(y-ly)>1.2 || pts[i][0]>=to){ g.lineTo(x,y); lx=x; ly=y; }
      if(pts[i][0]>=to) break;
    }
    g.strokeStyle=color; g.lineWidth=w; g.lineJoin='round'; g.lineCap='round'; g.stroke();
  };
  stroke(0,cur,'#3A434C',3);
  stroke(reach,total,'#6E7A85',3);
  stroke(cur,reach,'#FFB547',5);
  // km-Marken
  const steps=[1,2,5,10,25,50,100,200,500]; let step=steps.find(s=>s*m.scale>=80)||500;
  g.font='600 11px -apple-system,BlinkMacSystemFont,system-ui,sans-serif'; g.textBaseline='middle';
  for(let k=step;k<total;k+=step){
    const [la,lo]=routeLL(e.route,k), [px,py]=projLL(M.P,la,lo), [x,y]=S(px,py);
    if(x<-20||y<-20||x>W+20||y>H+20) continue;
    g.fillStyle='#C9D1D8'; g.beginPath(); g.arc(x,y,2.5,0,7); g.fill();
    g.lineWidth=3; g.strokeStyle='#0B0E11'; g.strokeText(k+' km',x+6,y); g.fillText(k+' km',x+6,y);
  }
  // Unterkünfte
  const byId=new Map((c?c.list:[]).map(r=>[r.a.id,r]));
  M.marks=[];
  const showNames = m.scale>=2.2; const labels=[];
  const items=e.accs.map(a=>({a, r:byId.get(a.id), ll:accLL(e,a)})).filter(o=>o.ll);
  items.sort((p,q)=>(p.r?1:0)-(q.r?1:0) || ((p.r&&p.r.recommended)?1:0)-((q.r&&q.r.recommended)?1:0));
  for(const o of items){
    const [px,py]=projLL(M.P,o.ll[0],o.ll[1]), [x,y]=S(px,py);
    if(x<-30||y<-30||x>W+30||y>H+30) continue;
    const behind=!o.r, col=markColor(o.r||{}, behind), big=o.r&&(o.r.recommended||o.r.status==='gebucht');
    const rad=big?10:7.5;
    if(o.a.id===ui.mapSel){ g.beginPath(); g.arc(x,y,rad+6,0,7); g.strokeStyle='#F2F4F5'; g.lineWidth=2.5; g.stroke(); }
    g.beginPath(); g.arc(x,y,rad,0,7); g.fillStyle=col; g.fill(); g.lineWidth=2; g.strokeStyle='#0B0E11'; g.stroke();
    if(o.r&&o.r.status==='gebucht'){ g.strokeStyle='#0B0E11'; g.lineWidth=2.5; g.beginPath(); g.moveTo(x-4,y); g.lineTo(x-1,y+3); g.lineTo(x+4.5,y-3.5); g.stroke(); }
    M.marks.push({x,y,id:o.a.id,rad,t:(showNames && (!behind || m.scale>=12)) ? o.a.name+(o.r?' · '+hmPlain(o.r.eta):'') : null, big, behind});
  }
  // Beschriftungen: wichtigste zuerst, überlappende weglassen
  const order=M.marks.slice().reverse();
  for(const mk of order){
    if(!mk.t) continue;
    g.font=(mk.big?'700 ':'600 ')+'12px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';
    const w=g.measureText(mk.t).width;
    const fits=bx=>{ const box=[bx-2, mk.y-9, bx+w+2, mk.y+9];
      if(box[0]<4 || box[2]>W-4) return null;
      if(box[2]>W-62 && box[1]<250) return null; // Kartenknöpfe
      if(labels.some(b=>!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3]))) return null;
      return box; };
    let bx=mk.x+mk.rad+5, box=fits(bx);
    if(!box){ bx=mk.x-mk.rad-5-w; box=fits(bx); }
    if(!box) continue;
    labels.push(box);
    g.lineWidth=3.5; g.strokeStyle='#0B0E11'; g.strokeText(mk.t,bx,mk.y); g.fillStyle=mk.behind?'#7D8893':'#F2F4F5'; g.fillText(mk.t,bx,mk.y);
  }
  // Position
  const [la,lo]=routeLL(e.route,cur), [ppx,ppy]=projLL(M.P,la,lo), [x,y]=S(ppx,ppy);
  g.beginPath(); g.arc(x,y,17,0,7); g.fillStyle='rgba(90,169,255,.22)'; g.fill();
  g.beginPath(); g.arc(x,y,8,0,7); g.fillStyle=MCOL.pos; g.fill(); g.lineWidth=3; g.strokeStyle='#F2F4F5'; g.stroke();
  // Massstab
  const sk=[0.5,1,2,5,10,20,50,100].find(s=>s*m.scale>=60)||100, sw=sk*m.scale;
  g.fillStyle='#C9D1D8'; g.fillRect(12,H-18,sw,3); g.font='600 11px -apple-system,system-ui,sans-serif'; g.textBaseline='bottom';
  g.lineWidth=3; g.strokeStyle='#0B0E11'; g.strokeText(sk+' km',12,H-22); g.fillText(sk+' km',12,H-22);
}
let _rzT=null; window.addEventListener('resize', ()=>{ clearTimeout(_rzT); _rzT=setTimeout(()=>{ if(ui.view==='karte'&&ui.kmode==='map') render(); }, 150); });

/* ---- Aktionen ---- */
function setStatus(id, s){
  const e=ev(); e.status=e.status||{};
  e.status[id]=s;
  if(s==='gebucht'){ if(e.bookedId && e.bookedId!==id) e.status[e.bookedId]='offen'; e.bookedId=id;
    try{ const r=computeOptions(e, fromLocalInput(e.lage.time)).list.find(x=>x.a.id===id); if(r) e.lastStartMs=r.start; }catch(_){} }
  else if(e.bookedId===id) e.bookedId=null;
  saveStore();
}
const MSTEP = {power:{d:5,min:60,max:400}, mass:{d:1,min:50,max:160}, pause:{d:1,min:0,max:40}, climbK:{d:1,min:0,max:12}, climbMax:{d:5,min:0,max:80}, descDay:{d:5,min:20,max:80}, descNight:{d:5,min:15,max:70}, cda:{d:0.01,min:0.2,max:0.6}, crr:{d:0.0005,min:0.002,max:0.012}};
const STEP = {
  minSleep:{d:15,min:60,max:720},
  maxRide:{d:0.5,min:0.5,max:16}
};
function clamp(v,s){ return Math.min(s.max, Math.max(s.min, Math.round(v*100)/100)); }

document.addEventListener('click', ev_=>{
  const el=ev_.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, e=ev();
  if(el.tagName==='INPUT') return; // radio/file handled on change
  switch(a){
    case 'go': if(el.dataset.v==='lage' && ui.view!=='lage' && !(e.id==='demo' && ui.timeOverride)) ui.timeOverride=false; ui.view=el.dataset.v; ui.confirmDelete=false; render(); window.scrollTo(0,0); break;
    case 'timeOther': ui.timeOverride=true; render(); break;
    case 'timeNow': ui.timeOverride=false; render(); break;
    case 'newEv': ui.newEvent=true; render(); setTimeout(()=>document.getElementById('newEvName')?.focus(),0); break;
    case 'newEvCancel': ui.newEvent=false; render(); break;
    case 'newEvSave': {
      const n=(document.getElementById('newEvName').value||'').trim(); if(!n){ toast('Bitte einen Namen eingeben.'); return; }
      const x=newEvent(n,''); store.events.push(x); store.currentId=x.id; ui.newEvent=false; saveStore(); render(); break; }
    case 'demo': {
      const d=demoEvent(Date.now());
      store.events=store.events.filter(x=>x.id!=='demo'); store.events.push(d); store.currentId=d.id; saveStore(); ui.timeOverride=true; ui.view='lage'; render(); toast('Demo-Event geladen – Zeit fest auf 19:40 gesetzt.'); break; }
    case 'setStep': { const k=el.dataset.k, s=STEP[k]; e[k]=clamp(e[k]+s.d*(+el.dataset.d),s); if(k==='minSleep') e.lage.minSleep=e[k]; saveStore(); render(); break; }
    case 'mStep': { const k=el.dataset.k, s=MSTEP[k]; const m=modelOf(e); e.model=Object.assign({}, e.model||{}); e.model[k]=Math.min(s.max, Math.max(s.min, Math.round((m[k]+s.d*(+el.dataset.d))*10000)/10000)); saveStore(); render(); break; }
    case 'wake': { const now=fromLocalInput(e.lage.time); const w=wakeFor(e, now)+(+el.dataset.d)*30*60e3; e.lage.wake=Math.min(now, w); e.lage.wakeFor=dayKey(now); saveStore(); render(); break; }
    case 'wakeAuto': e.lage.wake=null; e.lage.wakeFor=null; saveStore(); render(); break;
    case 'mReset': e.model={}; saveStore(); render(); toast('Standardwerte gesetzt.'); break;
    case 'lStep': { const k=el.dataset.k, s=STEP[k]; e.lage[k]=clamp(e.lage[k]+s.d*(+el.dataset.d),s); saveStore(); render(); break; }
    case 'feel': { const n=+el.dataset.n; e.lage.feel=n; e.lage.maxRide=FEEL_MAXRIDE[n-1]; saveStore(); render(); break; }
    case 'gps': doGps(); break;
    case 'calc': {
      if(!ui.timeOverride) e.lage.time=toLocalInput(Date.now());
      const t=fromLocalInput(e.lage.time), km=+e.lage.km||0;
      saveStore(); ui.view=e.bookedId && e.accs.some(x=>x.id===e.bookedId && x.km>km)? 'gebucht':'optionen'; render(); window.scrollTo(0,0); break; }
    case 'detail': if(ui.view!=='detail') ui.back=ui.view; ui.detailId=el.dataset.id; ui.view='detail'; render(); window.scrollTo(0,0); break;
    case 'kmode': ui.kmode=el.dataset.m; render(); break;
    case 'mzoom': mapZoom(+el.dataset.d>0?1.6:1/1.6); break;
    case 'mpos': mapCenterPos(); break;
    case 'mfit': mapFit(); drawMap(); break;
    case 'mclose': ui.mapSel=null; render(); break;
    case 'status': setStatus(ui.detailId, el.dataset.s); if(el.dataset.s==='gebucht'){ ui.view='gebucht'; window.scrollTo(0,0); toast('Als gebucht markiert.'); } render(); break;
    case 'status2': setStatus(el.dataset.id, el.dataset.s); render(); break;
    case 'csvPaste': { const t=document.getElementById('csvText').value; importCsv(t); break; }
    case 'swUpdate': if(off.update){ off.update.postMessage('skipWaiting'); } break;
    case 'export': exportJson(); break;
    case 'copyExport': copyText(JSON.stringify({app:'schlafplatz-finder',v:1,event:e}), 'Sicherung kopiert – z. B. in Notizen einfügen.'); break;
    case 'copyMail': { const {r}=findCalc(ui.detailId); if(r){ const T=texts(r.a.lang, contactVars(e,r)); copyText(T.subj+'\n\n'+T.mail, 'Betreff und Text kopiert.'); } break; }
    case 'delEv': ui.confirmDelete=true; render(); break;
    case 'delEvYes': {
      store.events=store.events.filter(x=>x.id!==e.id);
      if(!store.events.length) store.events.push(newEvent('Neues Event',''));
      store.currentId=store.events[0].id; ui.confirmDelete=false; saveStore(); render(); toast('Event gelöscht.'); break; }
  }
});
document.addEventListener('toggle', ev_=>{ const d=ev_.target; if(d.dataset && d.dataset.keep){ ui.open=ui.open||{}; ui.open[d.dataset.keep]=d.open; } }, true);
document.addEventListener('change', ev_=>{
  const el=ev_.target, e=ev();
  if(el.dataset.a==='pickEvent'){ store.currentId=el.dataset.id; ui.confirmDelete=false; saveStore(); render(); return; }
  if(el.dataset.a==='gpx'){ readFile(el, txt=>{ try{ e.route=parseGPX(txt, el.files[0].name.replace(/\.gpx$/i,'')); relocateAccs(e); saveStore(); render(); toast(`Route geladen: ${fmtKm(e.route.totalKm)} km, ${fmtInt(e.route.totalHm)} Hm.`); }catch(err){ toast(err.message||'GPX konnte nicht gelesen werden.'); } }); return; }
  if(el.dataset.a==='csv'){ readFile(el, importCsv); return; }
  if(el.dataset.a==='importJson'){ readFile(el, importJson); return; }
  if(el.dataset.f){
    const k=el.dataset.f; e[k]=el.value; saveStore();
    if(k==='name') render();
    return;
  }
  if(el.dataset.l){
    const k=el.dataset.l;
    if(k==='km') e.lage.km = el.value===''? 0 : Math.max(0, parseFloat(el.value)||0);
    else if(k==='tempoOverride') e.lage.tempoOverride = parseFloat(el.value)>0 ? parseFloat(el.value) : null;
    else e.lage[k]=el.value;
    saveStore(); render();
  }
});
function readFile(input, cb){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>cb(String(r.result)); r.onerror=()=>toast('Datei konnte nicht gelesen werden.'); r.readAsText(f);
}
function relocateAccs(e){
  for(const a of e.accs){
    if((a.km==null||a.kmGuessed)){ const c=parseCoords(a.coords); if(c){ const s=snapToRoute(e.route,c.lat,c.lon); a.km=Math.round(s.km*10)/10; a.kmGuessed=true; if(a.detKm==null) a.detKm=Math.round(s.dist*1.3*10)/10; } }
  }
}
function importCsv(text){
  const e=ev();
  try{
    const accs=rowsToAccs(parseCSV(text), e.route);
    // Status aus dem Rennen nach Name erhalten
    const old={}; e.accs.forEach(a=>{ if(e.status&&e.status[a.id]) old[a.name+'|'+a.ort]=e.status[a.id]; });
    const booked = e.bookedId ? e.accs.find(a=>a.id===e.bookedId) : null;
    e.status={}; e.bookedId=null;
    accs.forEach(a=>{ const s=old[a.name+'|'+a.ort]; if(s){ e.status[a.id]=s; if(s==='gebucht') e.bookedId=a.id; } });
    if(booked && !e.bookedId){ const m=accs.find(a=>a.name===booked.name&&a.ort===booked.ort); if(m){ e.status[m.id]='gebucht'; e.bookedId=m.id; } }
    e.accs=accs; saveStore(); render(); toast(`${accs.length} Unterkünfte importiert.`);
  }catch(err){ toast(err.message||'Import fehlgeschlagen.'); }
}
function copyText(t, okMsg){
  try{ navigator.clipboard.writeText(t).then(()=>toast(okMsg), ()=>toast('Kopieren nicht erlaubt.')); }catch(err){ toast('Kopieren nicht erlaubt.'); }
}
function exportJson(){
  const e=ev();
  const blob=new Blob([JSON.stringify({app:'schlafplatz-finder',v:1,event:e})],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=(e.name||'event').replace(/[^\w\-]+/g,'_')+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function importJson(text){
  try{
    const d=JSON.parse(text); const x=d.event; if(!x||!x.name||!Array.isArray(x.accs)) throw new Error('Keine gültige Sicherung.');
    x.id='e'+Date.now().toString(36); store.events.push(x); store.currentId=x.id; saveStore(); render(); toast('Sicherung importiert.');
  }catch(err){ toast(err.message||'Import fehlgeschlagen.'); }
}
function doGps(){
  const e=ev();
  if(!navigator.geolocation){ toast('GPS ist hier nicht verfügbar – km bitte von Hand eingeben.'); return; }
  toast('Suche Position …');
  navigator.geolocation.getCurrentPosition(p=>{
    const s=snapToRoute(e.route, p.coords.latitude, p.coords.longitude);
    e.lage.km=Math.round(s.km*10)/10; e.lage.time=toLocalInput(Date.now()); saveStore(); render();
    toast(s.dist>2 ? `Achtung: ${fmtKm(s.dist)} km neben der Route. km ${fmtKm(s.km)} übernommen.` : `km ${fmtKm(s.km)} übernommen.`);
  }, err=>toast('Keine Position: '+(err.code===1?'Zugriff verweigert.':'nicht verfügbar.')+' km bitte von Hand eingeben.'), {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}

/* ---- Offline (Service Worker) ---- */
function setupOffline(){
  if(!off.supported) return;
  try{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const markWaiting=w=>{ off.update=w; if(ui.view==='setup') render(); toast('Neue Version verfügbar – im Setup laden.'); };
      if(reg.waiting && navigator.serviceWorker.controller) markWaiting(reg.waiting);
      reg.addEventListener('updatefound', ()=>{
        const w=reg.installing; if(!w) return;
        w.addEventListener('statechange', ()=>{
          if(w.state==='installed'){
            if(navigator.serviceWorker.controller) markWaiting(w);
            else { off.ready=true; if(ui.view==='setup') render(); }
          }
        });
      });
      return navigator.serviceWorker.ready;
    }).then(()=>{ off.ready=true; if(ui.view==='setup') render(); }).catch(()=>{});
    let reloaded=false; const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!hadController){ off.ready=true; return; } if(reloaded) return; reloaded=true; location.reload(); });
  }catch(e){}
  try{
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persisted().then(p=> p ? true : navigator.storage.persist()).then(p=>{ off.persisted=!!p; if(ui.view==='setup') render(); }).catch(()=>{});
    }
  }catch(e){}
}
setInterval(()=>{ if(ui.view==='lage' && !ui.timeOverride){ const c=document.getElementById('nowClock'); const n=Date.now(); ev().lage.time=toLocalInput(n); if(c) c.textContent=hmPlain(n); } }, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && ui.view==='lage' && !ui.timeOverride) render(); });
setupOffline();
render();
</script>
